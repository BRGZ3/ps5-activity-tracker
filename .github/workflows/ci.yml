name: v1.0 checks

on:
  push:
  pull_request:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check public tree
        run: python3 tools/check_public_tree.py
      - name: Run host tests
        run: python3 -m unittest discover -s tests -v
      - name: Check carrier builder syntax
        run: node --check release-build/build-carrier.js
